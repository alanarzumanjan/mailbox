# Local development in one command:
#   cp .env.example .env
#   docker compose up --build
#
# API:     http://localhost:4000      Swagger: http://localhost:4000/docs
# MongoDB: mongodb://localhost:27017/emptyless (DBeaver / Compass)
# With an empty database the API seeds demo data and prints the device key.
# Recreate demo data: docker compose exec api node src/seed/seed.js

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017" # this machine only
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the docker network the database is reached by service name, not localhost
      MONGODB_URI: mongodb://mongo:27017/emptyless
      # development, so an empty database is seeded with demo data on startup
      NODE_ENV: development
      TZ: Europe/Riga
    ports:
      - "4000:4000"

volumes:
  mongo_data:
